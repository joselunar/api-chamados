name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  phpunit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: intl, mbstring, mysql
      - run: composer install --no-interaction --prefer-dist
      - run: php vendor/bin/phpunit tests/unit/TicketRulesTest.php
